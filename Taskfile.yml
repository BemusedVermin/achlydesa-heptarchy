version: "3"

tasks:
  fmt:
    desc: Format all Go files in place (gofmt, goimports, golines)
    preconditions:
      - sh: command -v golangci-lint
        msg: "golangci-lint is not on the PATH; install it from https://golangci-lint.run/welcome/install/"
    cmds:
      - golangci-lint fmt

  fmt-check:
    desc: Fail if any Go file is not formatted (gofmt, goimports, golines)
    preconditions:
      - sh: command -v golangci-lint
        msg: "golangci-lint is not on the PATH; install it from https://golangci-lint.run/welcome/install/"
    cmds:
      - golangci-lint fmt --diff

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: "Run tests (extra args after --, e.g. -- -run Foo ./internal/core/sim)"
    cmds:
      - go test {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./...{{end}}

  test-affected:
    desc: "Test only the packages a change can affect (BASE=origin/master); CI uses this"
    cmds:
      - go run ./internal/tools/affected {{if .BASE}}--base {{.BASE}}{{end}}

  bench:
    desc: "Run benchmarks, no tests (BENCH=<regexp>, default all; args after --, e.g. BENCH=Step -- -count 6 ./internal/core/game)"
    cmds:
      - go test -run '^$' -bench '{{.BENCH | default "."}}' -benchmem {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./...{{end}}

  lint:
    desc: Run golangci-lint (a separately installed binary)
    preconditions:
      - sh: command -v golangci-lint
        msg: "golangci-lint is not on the PATH; install it from https://golangci-lint.run/welcome/install/"
    cmds:
      # Agents run in parallel, so don't refuse to run beside another golangci-lint.
      - golangci-lint run --allow-parallel-runners

  schema:
    desc: Regenerate the CUE schemas (*_go_gen.cue) from the Go content structs
    cmds:
      - go tool cue get go --local ./internal/core/api ./internal/core/comp ./internal/content
      - go run ./internal/tools/cuefix internal

  content:
    desc: Validate the content data against the schemas, and check its formatting
    cmds:
      - go tool cue vet ./content/...
      - go tool cue fmt --check ./content/...

  check:
    desc: Run every check before finishing (fmt-check, vet, test, lint, content)
    cmds:
      - task: fmt-check
      - task: vet
      - task: test
      - task: lint
      - task: content

  check-ci:
    desc: "Like check, but tests only the affected packages (BASE=origin/master); used by CI"
    cmds:
      - task: fmt-check
      - task: vet
      - task: test-affected
      - task: lint
      - task: content

  check-pr:
    desc: "Check this branch's task bookkeeping; for a cleanup task, that it changed no behavior (CI runs it on every PR)"
    cmds:
      - go run ./internal/tools/agentkit check-pr {{.CLI_ARGS}}

  comments:
    desc: "List the comments that break .claude/rules/comments.md (-- ./internal/core/combat ./internal/content)"
    cmds:
      - go run ./internal/tools/agentkit comments {{.CLI_ARGS}}

  clean-worktrees:
    desc: "Remove agent worktrees and merged agent branches that hold nothing unsaved (-- --dry-run to preview)"
    cmds:
      - go run ./internal/tools/agentkit clean-worktrees {{.CLI_ARGS}}

  run:
    desc: Run the game (args after --, e.g. -- play --seed 1)
    cmds:
      - go run ./cmd/heptarchy {{.CLI_ARGS}}
