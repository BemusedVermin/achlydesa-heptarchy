name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To post the test-time report as a comment on the pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history, so the check can compare the PR with its base branch.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: binary
          install-only: true
      # Master's test times from its last run, to compare this pull request with. The key never
      # matches exactly; the prefix finds the newest one saved.
      - if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: test-times-master.txt
          key: test-times-master-none
          restore-keys: test-times-master-
      # On a pull request, test only the packages the change can affect (internal/tools/affected).
      # A push to master has no base, so it tests everything. The log feeds the test-time report.
      - name: check
        shell: bash
        run: go tool task check-ci 2>&1 | tee check.log
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      # Task bookkeeping: INDEX.md matches the task files, and a task branch's task is done. For a
      # cleanup task (task/C...), also that it changed no behavior, or, for a tests task, only tests.
      - name: task check
        if: github.event_name == 'pull_request'
        run: go tool task check-pr -- --branch "$HEAD_REF" --base "origin/$BASE_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
      # Lists the slowest packages and warns about slow ones; never fails.
      - name: test times
        if: always()
        run: |
          go run ./internal/tools/testtimes --budget 30s --summary test-times.md \
            --baseline test-times-master.txt --save test-times-master.txt check.log
          cat test-times.md >> "$GITHUB_STEP_SUMMARY"
      # Posts the report as one comment on the pull request, edited in place on each push.
      - name: test-time comment
        if: always() && github.event_name == 'pull_request' && hashFiles('test-times.md') != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- test-times -->'
          { echo "$marker"; cat test-times.md; echo; echo "<sub>Commit ${HEAD_SHA:0:7}, [CI run]($RUN_URL)</sub>"; } > comment.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
      - if: github.event_name == 'push' && success()
        uses: actions/cache/save@v4
        with:
          path: test-times-master.txt
          key: test-times-master-${{ github.sha }}

  # The owner works on Windows, while agents and the check above run on Linux. This catches what only
  # breaks there: path separators, line endings, case-insensitive file names.
  check-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: binary
          install-only: true
      - name: check
        shell: bash
        run: go tool task check-ci
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
