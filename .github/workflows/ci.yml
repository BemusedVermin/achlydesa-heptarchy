name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history, so the check can compare the PR with its base branch.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: binary
          install-only: true
      # Master's test times from its last run, to compare this pull request with. The key never
      # matches exactly; the prefix finds the newest one saved.
      - if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: test-times-master.txt
          key: test-times-master-none
          restore-keys: test-times-master-
      # On a pull request, test only the packages the change can affect (internal/tools/affected).
      # A push to master has no base, so it tests everything. The log feeds the test-time report.
      - name: check
        shell: bash
        run: go tool task check-ci 2>&1 | tee check.log
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      # Lists the slowest packages in the run's summary and warns about slow ones; never fails.
      - name: test times
        if: always()
        run: >-
          go run ./internal/tools/testtimes --budget 30s --summary "$GITHUB_STEP_SUMMARY"
          --baseline test-times-master.txt --save test-times-master.txt check.log
      - if: github.event_name == 'push' && success()
        uses: actions/cache/save@v4
        with:
          path: test-times-master.txt
          key: test-times-master-${{ github.sha }}
